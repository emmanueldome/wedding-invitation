<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wedding Invitation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- IMAGE (LONG PRESS TARGET) -->
  <img src="../Assets/image/p-e.jpeg"
       alt="Wedding Picture"
       class="centered-image"
       id="secretImage">

  <!-- LANGUAGE SWITCH -->
  <div class="lang-switch">
    <button type="button" onclick="setLang('en')">English</button>
    <button type="button" onclick="setLang('sw')">Swahili</button>
  </div>

  <h1 id="site-title">Wedding Invitation</h1>
  <div class="decorative-line"></div>

  <h2 id="couple-names">Mr Japhet Blasio</h2>
  <div class="decorative-line small"></div>

  <p id="date"><strong>Date:</strong> Sunday, 01 March 2026</p>
  <p id="time"><strong>Time:</strong> 18:00 PM</p>
  <p id="venue"><strong>Venue:</strong> Mbezi Garden Hotel, Dar es Salaam</p>

  <a id="view-venue" href="https://maps.google.com/?q=Mbezi+Garden+Hotel" target="_blank">
    📍 View Venue Location
  </a>

  <p class="invite-text" id="invite-text">
    Kindly join us to celebrate our special day
  </p>

  <!-- COUNTDOWN -->
  <div class="countdown-container">
    <h3 id="countdown-title">Countdown to Our Wedding</h3>
    <div id="countdown">
      <div class="countdown-box"><span id="days">00</span><small id="days-text">Days</small></div>
      <div class="countdown-box"><span id="hours">00</span><small id="hours-text">Hours</small></div>
      <div class="countdown-box"><span id="minutes">00</span><small id="minutes-text">Minutes</small></div>
      <div class="countdown-box"><span id="seconds">00</span><small id="seconds-text">Seconds</small></div>
    </div>
  </div>

  <!-- RSVP -->
  <div class="rsvp-section">
    <h3 id="rsvp-title">RSVP</h3>
    <p id="rsvp-subtitle">Please confirm your attendance</p>

    <form onsubmit="sendRSVP(event)">
      <label id="q-attend">Will you attend our wedding?</label>

      <div class="attendance-options">
        <label>
          <input type="radio" name="attendance" value="Will attend" required>
          <span id="opt-yes">Yes, I will attend</span>
        </label>

        <label>
          <input type="radio" name="attendance" value="Will not attend">
          <span id="opt-no">Sorry, I can’t attend</span>
        </label>
      </div>

      <input type="number" id="guests" placeholder="Number of guests" min="1">
      <textarea id="message" placeholder="Optional message"></textarea>

      <button type="submit" id="send-btn">Send RSVP via WhatsApp</button>
    </form>
  </div>

  <!-- RECEPTIONIST BUTTON (HIDDEN) -->
  <button id="receptionBtn"
          style="display:none;margin-top:25px;background:#2f6f4e;color:white;
                 padding:15px;border-radius:30px;border:none;font-weight:bold;"
          onclick="confirmEntry()">
    ✅ Confirm Guest Entry
  </button>

</div>

<script>
/* ================= COUNTDOWN ================= */
const weddingDate = new Date("March 1, 2026 18:00:00").getTime();
setInterval(() => {
  const now = new Date().getTime();
  const d = weddingDate - now;
  if (d < 0) return;

  days.textContent = Math.floor(d / (1000*60*60*24));
  hours.textContent = Math.floor((d / (1000*60*60)) % 24);
  minutes.textContent = Math.floor((d / (1000*60)) % 60);
  seconds.textContent = Math.floor((d / 1000) % 60);
}, 1000);

/* ================= LANGUAGE SWITCH ================= */
function setLang(lang){
  if(lang==="sw"){
    site-title.innerText="Mwaliko wa Harusi";
    rsvp-title.innerText="Thibitisha Hudhurio";
    rsvp-subtitle.innerText="Tafadhali thibitisha uwepo wako";
    q-attend.innerText="Je, utahudhuria?";
    opt-yes.innerText="Ndiyo, nitahudhuria";
    opt-no.innerText="Samahani, sitaweza";
    guests.placeholder="Idadi ya wageni";
    message.placeholder="Ujumbe (hiari)";
    send-btn.innerText="Tuma RSVP WhatsApp";
  } else location.reload();
}

/* ================= RSVP WHATSAPP ================= */
function sendRSVP(e){
  e.preventDefault();
  const attend=document.querySelector('input[name="attendance"]:checked').value;
  const g=guests.value||"Not specified";
  const m=message.value||"-";

  const txt=`Wedding RSVP
Attendance: ${attend}
Guests: ${g}
Message: ${m}`;

  window.open(`https://wa.me/255783532235?text=${encodeURIComponent(txt)}`,"_blank");
}

/* ================= RECEPTIONIST MODE ================= */
let pressTimer;
const img=document.getElementById("secretImage");

img.addEventListener("touchstart", startPress);
img.addEventListener("mousedown", startPress);

img.addEventListener("touchend", cancelPress);
img.addEventListener("mouseup", cancelPress);

function startPress(){
  pressTimer=setTimeout(()=>{
    const pin=prompt("Enter Reception PIN:");
    if(pin==="1999"){
      navigator.vibrate?.(200);
      alert("Reception Mode Activated");
      receptionBtn.style.display="block";
    } else alert("Wrong PIN");
  },3000);
}

function cancelPress(){ clearTimeout(pressTimer); }

/* ================= CONFIRM ENTRY ================= */
function confirmEntry(){
  const time=new Date().toLocaleTimeString();
  const msg=`GUEST CHECK-IN ✅
Couple: Japhet Blasio
Time: ${time}
Status: Allowed Entry`;

  window.open(`https://wa.me/255792800846?text=${encodeURIComponent(msg)}`,"_blank");
}
</script>

</body>
</html>
